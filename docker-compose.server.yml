services:
  postgres:
    image: postgres:15-alpine
    container_name: ai_employee_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ai_interview}
    volumes:
      - ai_employee_postgres_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ai_interview}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    image: ai-employee-backend:latest
    container_name: ai_employee_backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-ai_interview}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env before starting production}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-admin@example.com}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:?Set INITIAL_ADMIN_PASSWORD in .env before first production startup}
      INITIAL_ADMIN_NAME: ${INITIAL_ADMIN_NAME:-System Admin}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      RESUME_PARSE_MAX_CONCURRENT: ${RESUME_PARSE_MAX_CONCURRENT:-8}
      LLM_PROVIDER: ${LLM_PROVIDER:-dashscope}
      LLM_MODEL: ${LLM_MODEL:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://ai.etgq.com}
      APP_ENV: production
    volumes:
      - ai_employee_backend_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
    image: ai-employee-frontend:latest
    container_name: ai_employee_frontend
    ports:
      - "127.0.0.1:18080:80"
    depends_on:
      - backend
    restart: always

volumes:
  ai_employee_postgres_data:
  ai_employee_backend_uploads:
